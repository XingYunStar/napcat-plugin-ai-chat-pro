<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天插件仪表盘</title>
  <style>
    :root {
      --bg-primary: rgba(255, 255, 255, 0.4);
      --bg-card: rgba(255, 255, 255, 0.5);
      --bg-item: rgba(0,0,0,0.03);
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-muted: #999;
      --border-color: rgba(0,0,0,0.06);
      --accent: #52525b;
      --accent-light: rgba(82,82,91,0.1);
      --success: #17c964;
      --danger: #f31260;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: rgba(0,0,0,0.2);
        --bg-card: rgba(255,255,255,0.05);
        --bg-item: rgba(255,255,255,0.05);
        --text-primary: #f5f5f5;
        --text-secondary: #a1a1a1;
        --text-muted: #666;
        --border-color: rgba(255,255,255,0.1);
        --accent: #818cf8;
        --accent-light: rgba(129,140,248,0.2);
      }
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent; padding: 16px; color: var(--text-primary);
    }
    .container { max-width: 960px; margin: 0 auto; }
    .card {
      background: var(--bg-card); backdrop-filter: blur(10px); border-radius: 14px;
      padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color);
    }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    h3 { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin: 16px 0 8px; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 10px; }
    .stat { background: var(--bg-item); border-radius: var(--radius); padding: 12px; text-align: center; border:1px solid var(--border-color); }
    .stat .label { font-size: 11px; color: var(--text-muted); }
    .stat .value { font-size: 16px; font-weight: 600; color: var(--accent); }
    .form-group { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; }
    .form-group label { width: 150px; font-size: 13px; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-item); color: var(--text-primary); font-size: 13px;
      font-family: inherit; min-width: 200px;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input[type="checkbox"] { width: auto; flex: 0; margin-left: 0; min-width: auto; }
    .form-group .checkbox-label { width: auto; margin-left: 6px; }
    .btn {
      padding: 8px 16px; border-radius: var(--radius); border: none; font-size: 13px;
      font-weight: 500; cursor: pointer; transition: 0.2s; margin-right: 8px; color: white;
    }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-test { background: #6b7280; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    .feedback { margin-top: 12px; padding: 10px; border-radius: var(--radius); font-size: 13px; }
    .feedback.success { background: rgba(23,201,100,0.15); color: var(--success); border:1px solid rgba(23,201,100,0.3); }
    .feedback.error { background: rgba(243,18,96,0.1); color: var(--danger); border:1px solid rgba(243,18,96,0.2); }
    .model-status { margin-top: 8px; padding: 8px; border-radius: 6px; font-size: 12px; background: var(--bg-item); border:1px solid var(--border-color); white-space: pre-wrap; }
    .hint { font-size: 12px; color: var(--text-muted); margin: 4px 0; }
    .author { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 16px; }
    .author a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <!-- 状态卡片 -->
  <div class="card">
    <h2>📊 运行状态</h2>
    <div id="status-panel"><div class="grid"><div class="stat"><div class="label">加载中...</div></div></div></div>
  </div>

  <!-- 设置卡片 -->
  <div class="card">
    <h2>⚙️ 全部设置</h2>
    <div id="settings-form"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
      <button class="btn btn-test" onclick="refreshAll()">🔄 刷新</button>
    </div>
    <div id="save-feedback"></div>
    <div class="hint">💡 保存设置后再次打开设置将自动获取模型列表。关闭插件启用后，等待5秒后再打开设置，或前往扩展页面进行设置。</div>
  </div>

  <div class="author">
    作者：星陨 · 交流群：<a href="https://bot.likefirefly.com" target="_blank">1046894467</a>
  </div>
</div>

<script>
// 根据当前页面路径提取插件名称
const pathParts = window.location.pathname.split('/');
const pluginName = pathParts[2] || 'AI聊天';
const apiBase = `/api/Plugin/ext/${pluginName}`;

// ---------- Token 获取 ----------
function getToken() {
  const keys = ['token', 'access_token', 'napcat_token', 'webui_token'];
  for (const key of keys) {
    const tok = localStorage.getItem(key) || sessionStorage.getItem(key);
    if (tok) return tok;
  }
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token') || params.get('access_token');
  if (urlToken) { localStorage.setItem('token', urlToken); return urlToken; }
  return '';
}
const authToken = getToken();

async function authFetch(endpoint, options = {}) {
  const headers = options.headers || {};
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  if (options.method === 'POST' && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  return fetch(`${apiBase}${endpoint}`, { ...options, headers });
}

// ---------- 字段定义（带完整提示）----------
const fields = [
  { key: 'enableChat', label: '总开关', type: 'boolean', category: '基本' },
  { key: 'enableWakeWord', label: '启用唤醒词', type: 'boolean', category: '触发' },
  { key: 'wakeWord', label: '唤醒词', type: 'text', placeholder: '机器人', desc: 'AI聊天前缀，例如：机器人，发送机器人你好，AI将收到你好' },
  { key: 'enableAt', label: '启用 @ 触发', type: 'boolean', desc: '@ 机器人触发' },

  { key: 'apiUrl', label: 'API 地址', type: 'text', placeholder: 'https://api.deepseek.com', 
    desc: '例如 https://api.deepseek.com，或者前往 https://likefirefly.com/ai 注册并实名认证后可获得16块额度，即可使用几乎所有大模型', category: '文本模型' },
  { key: 'apiKey', label: 'API 密钥', type: 'password', category: '文本模型' },
  { key: 'model', label: '选择模型', type: 'select', optionsKey: 'textModels', category: '文本模型', 
    desc: '从 API 获取，在本webui下方点击保存按钮后，再点击刷新按钮后，可获取到模型列表' },
  { key: 'customModel', label: '自定义模型', type: 'text', placeholder: '覆盖上方选择', category: '文本模型' },
  { key: 'systemPrompt', label: '系统提示词', type: 'textarea', placeholder: '你是一个有用的助手。', desc: '可设置AI的人设、世界观等', category: '文本模型' },
  { key: 'maxTokens', label: 'Max Tokens', type: 'number', placeholder: '2000', desc: '生成回复的最大长度（通常 1-128k）', category: '文本模型' },
  { key: 'temperature', label: 'Temperature', type: 'number', step: '0.1', placeholder: '0.7', desc: '随机性参数，0~2，越高越随机', category: '文本模型' },
  { key: 'topP', label: 'Top P', type: 'number', step: '0.1', placeholder: '1.0', desc: '核采样参数，0~1，越高越多样', category: '文本模型' },
  { key: 'enableReply', label: '引用回复', type: 'boolean', category: '文本模型' },
  { key: 'enableSplitReply', label: '分段回复', type: 'boolean', desc: '启用后按正则拆分长回复', category: '文本模型' },
  { key: 'splitRegex', label: '分段正则', type: 'text', placeholder: '[。！？!?…]+', desc: '默认定界符 [。！？!?…]+', category: '文本模型' },
  { key: 'maxHistoryRounds', label: '最大对话轮次', type: 'number', placeholder: '50', desc: '保留最近 N 轮对话，0 为不保留历史', category: '文本模型' },

  { key: 'enableVision', label: '启用视觉模型', type: 'boolean', category: '视觉模型' },
  { key: 'visionApiUrl', label: '视觉 API 地址', type: 'text', placeholder: 'https://api.siliconflow.cn',
    desc: '可前往 https://likefirefly.com/ai 注册并实名认证后，使用免费视觉模型，例如API填 https://api.siliconflow.cn，model填 deepseek-ai/DeepSeek-OCR', category: '视觉模型' },
  { key: 'visionApiKey', label: '视觉 API 密钥', type: 'password', category: '视觉模型' },
  { key: 'visionModel', label: '选择视觉模型', type: 'select', optionsKey: 'visionModels', category: '视觉模型',
    desc: '从 API 获取，在本webui下方点击保存按钮后，再点击刷新按钮后，可获取到模型列表' },
  { key: 'visionCustomModel', label: '自定义视觉模型', type: 'text', placeholder: '覆盖选择', category: '视觉模型' },

  { key: 'whitelistUsers', label: '用户白名单', type: 'text', placeholder: '逗号分隔 QQ 号', desc: '白名单优先', array: true, category: '访问控制' },
  { key: 'blacklistUsers', label: '用户黑名单', type: 'text', placeholder: '逗号分隔 QQ 号', array: true, category: '访问控制' },
  { key: 'whitelistGroups', label: '群白名单', type: 'text', placeholder: '逗号分隔群号', desc: '白名单优先', array: true, category: '访问控制' },
  { key: 'blacklistGroups', label: '群黑名单', type: 'text', placeholder: '逗号分隔群号', array: true, category: '访问控制' }
];

let currentConfig = {};
let textModels = [];
let visionModels = [];

// 显示模型列表获取状态
function setModelStatus(type, message, isError = false) {
  const textDiv = document.getElementById('text-model-status');
  const visionDiv = document.getElementById('vision-model-status');
  const div = type === 'text' ? textDiv : visionDiv;
  if (div) {
    div.style.display = 'block';
    div.innerHTML = message;
    div.className = `model-status ${isError ? 'feedback error' : 'feedback success'}`;
  }
}

// 加载运行状态
async function loadStatus() {
  try {
    const data = await authFetch('/status').then(r => r.json());
    if (data.code !== 0) throw new Error(data.message);
    const s = data.data;
    document.getElementById('status-panel').innerHTML = `
      <div class="grid">
        <div class="stat"><div class="label">插件名称</div><div class="value">${s.pluginName}</div></div>
        <div class="stat"><div class="label">运行时长</div><div class="value" style="color: var(--success)">${s.uptime}</div></div>
        <div class="stat"><div class="label">平台</div><div class="value">${s.platform}</div></div>
        <div class="stat"><div class="label">架构</div><div class="value">${s.arch}</div></div>
      </div>`;
  } catch (e) {
    document.getElementById('status-panel').innerHTML = `<div class="feedback error">状态加载失败: ${e.message}</div>`;
  }
}

// 加载模型列表（可强制刷新）
async function loadModels(forceRefresh = false) {
  const apiUrl = document.getElementById('cfg_apiUrl')?.value || currentConfig.apiUrl;
  const apiKey = document.getElementById('cfg_apiKey')?.value || currentConfig.apiKey;
  const visionApiUrl = document.getElementById('cfg_visionApiUrl')?.value || currentConfig.visionApiUrl;
  const visionApiKey = document.getElementById('cfg_visionApiKey')?.value || currentConfig.visionApiKey;

  // 文本模型
  if (apiUrl && apiKey && (forceRefresh || textModels.length === 0)) {
    setModelStatus('text', '⏳ 正在获取文本模型列表...');
    try {
      const res = await fetch(`${apiUrl}/v1/models`, {
        headers: { Authorization: `Bearer ${apiKey}` }
      });
      const contentType = res.headers.get('content-type');
      let data;
      if (contentType && contentType.includes('application/json')) {
        data = await res.json();
      } else {
        data = await res.text();
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}\n响应内容：\n${JSON.stringify(data, null, 2)}`);
      }
      textModels = (data.data || []).map(m => m.id).sort();
      setModelStatus('text', `✅ 文本模型获取成功（${textModels.length} 个）`, false);
    } catch (e) {
      setModelStatus('text', `❌ 文本模型获取失败：\n${e.message}`, true);
    }
  }

  // 视觉模型
  if (visionApiUrl && visionApiKey && (forceRefresh || visionModels.length === 0)) {
    setModelStatus('vision', '⏳ 正在获取视觉模型列表...');
    try {
      const res = await fetch(`${visionApiUrl}/v1/models`, {
        headers: { Authorization: `Bearer ${visionApiKey}` }
      });
      const contentType = res.headers.get('content-type');
      let data;
      if (contentType && contentType.includes('application/json')) {
        data = await res.json();
      } else {
        data = await res.text();
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}\n响应内容：\n${JSON.stringify(data, null, 2)}`);
      }
      visionModels = (data.data || []).map(m => m.id).sort();
      setModelStatus('vision', `✅ 视觉模型获取成功（${visionModels.length} 个）`, false);
    } catch (e) {
      setModelStatus('vision', `❌ 视觉模型获取失败：\n${e.message}`, true);
    }
  }

  updateSelectOptions();
}

// 加载配置并渲染
async function loadConfig() {
  try {
    const resp = await authFetch('/config');
    const data = await resp.json();
    if (data.code !== 0) throw new Error(data.message);
    currentConfig = data.data;
    renderForm(currentConfig);
    // 渲染后尝试加载模型（不强制，除非列表为空）
    await loadModels(false);
  } catch (e) {
    document.getElementById('settings-form').innerHTML = `<div class="feedback error">配置加载失败: ${e.message}</div>`;
  }
}

function renderForm(config) {
  let html = '';
  let lastCategory = '';
  for (const f of fields) {
    if (f.category && f.category !== lastCategory) {
      if (lastCategory) html += '</div>';
      html += `<h3>📌 ${f.category}</h3><div style="margin-left:8px">`;
      lastCategory = f.category;
    }
    html += buildFieldHTML(f, config);
  }
  if (lastCategory) html += '</div>';

  // 模型状态显示区域
  html += `
    <div id="text-model-status" class="model-status" style="display:none;"></div>
    <div id="vision-model-status" class="model-status" style="display:none; margin-top:6px;"></div>
  `;
  document.getElementById('settings-form').innerHTML = html;
  updateSelectOptions();
}

function buildFieldHTML(field, config) {
  const value = config[field.key];
  const id = `cfg_${field.key}`;
  let inputHtml = '';
  if (field.type === 'boolean') {
    const checked = value ? 'checked' : '';
    inputHtml = `<input type="checkbox" id="${id}" ${checked}>`;
  } else if (field.type === 'select') {
    inputHtml = `<select id="${id}"></select>`;
  } else if (field.type === 'textarea') {
    inputHtml = `<textarea id="${id}" rows="2" placeholder="${field.placeholder || ''}">${value || ''}</textarea>`;
  } else {
    const type = field.type === 'password' ? 'password' : (field.type === 'number' ? 'number' : 'text');
    const step = field.step ? `step="${field.step}"` : '';
    inputHtml = `<input type="${type}" id="${id}" value="${value || ''}" placeholder="${field.placeholder || ''}" ${step}>`;
  }
  const desc = field.desc ? `<div class="hint">${field.desc}</div>` : '';
  return `<div class="form-group">
    <label for="${id}">${field.label}</label>
    ${inputHtml}
    ${desc}
  </div>`;
}

function updateSelectOptions() {
  const textSelect = document.getElementById('cfg_model');
  if (textSelect) {
    textSelect.innerHTML = textModels.map(m => `<option value="${m}" ${m === currentConfig.model ? 'selected' : ''}>${m}</option>`).join('');
    if (textModels.length === 0) textSelect.innerHTML = '<option value="">无可用模型，在本webui下方点击保存按钮后，再点击刷新按钮后，可获取到模型列表</option>';
  }
  const visionSelect = document.getElementById('cfg_visionModel');
  if (visionSelect) {
    visionSelect.innerHTML = visionModels.map(m => `<option value="${m}" ${m === currentConfig.visionModel ? 'selected' : ''}>${m}</option>`).join('');
    if (visionModels.length === 0) visionSelect.innerHTML = '<option value="">无可用模型，在本webui下方点击保存按钮后，再点击刷新按钮后，可获取到模型列表</option>';
  }
}

function collectFormData() {
  const data = {};
  for (const f of fields) {
    const el = document.getElementById(`cfg_${f.key}`);
    if (!el) continue;
    let value;
    if (f.type === 'boolean') value = el.checked;
    else if (f.type === 'number') value = el.value.trim() === '' ? undefined : parseFloat(el.value);
    else value = el.value;
    if (f.array && typeof value === 'string') {
      value = value.split(',').map(s => s.trim()).filter(Boolean);
    }
    data[f.key] = value;
  }
  delete data.modelsList;
  delete data.visionModelsList;
  return data;
}

async function saveSettings() {
  const fb = document.getElementById('save-feedback');
  try {
    const config = collectFormData();
    const resp = await authFetch('/config', { method: 'POST', body: JSON.stringify(config) });
    const json = await resp.json();
    if (json.code !== 0) throw new Error(json.message);
    fb.innerHTML = '<div class="feedback success">✅ 设置已保存</div>';
    // 重新加载配置（确保界面同步）并强制刷新模型列表
    await loadConfig();
    await loadModels(true);
  } catch (e) {
    fb.innerHTML = `<div class="feedback error">❌ ${e.message}</div>`;
  }
}

async function refreshAll() {
  await loadStatus();
  await loadConfig();
  // 刷新时也强制拉取模型列表
  await loadModels(true);
}

// 初始化
refreshAll();
setInterval(refreshAll, 60000);
</script>
</body>
</html>
